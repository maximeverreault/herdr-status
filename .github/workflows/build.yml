name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install UI dependencies
        run: bun install --frozen-lockfile
        working-directory: ui
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features herdr-client/test-support -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --features herdr-client/test-support
      - name: UI tests
        run: bun run test
        working-directory: ui
      - name: Build bundles
        run: bun tauri build
        working-directory: ui
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: herdr-status-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
