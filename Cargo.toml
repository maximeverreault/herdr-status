[workspace]
resolver = "2"
members = ["crates/herdr-client", "crates/herdr-status-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "time", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
async-trait = "0.1"
toml = "0.8"
base64 = "0.22"
